<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Walia Recover – Turn missed customers into recovered revenue</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8f6;--c:#fff;--b:#e3e7e2;--t:#14201a;--m:#5b6a61;--p:#0b6b4d;--pt:#fff;--s:#e6f3ed;--w:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1411;--c:#151d18;--b:#26332b;--t:#eef3ef;--m:#9aa9a0;--p:#3dbd8c;--pt:#06210f;--s:#17302a;--w:#3a2f10}}
:root[data-theme=dark]{--bg:#0e1411;--c:#151d18;--b:#26332b;--t:#eef3ef;--m:#9aa9a0;--p:#3dbd8c;--pt:#06210f;--s:#17302a;--w:#3a2f10}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 'Plus Jakarta Sans','Noto Sans Ethiopic',system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800}h2{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800}h3{font-size:1.05rem}p{margin:.4rem 0}a{color:inherit}
.m{color:var(--m)}.w{max-width:1100px;margin:0 auto;padding:0 20px}.sec{padding:56px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{justify-content:space-between}
.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--b);box-shadow:0 2px 6px rgba(0,0,0,.06);background:var(--c);color:var(--t);font:600 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;transition:.15s}
.btn:hover{transform:translateY(-1px);border-color:var(--p)}.btn.p{background:linear-gradient(90deg,#1e5fd8,#10b981);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(16,130,150,.28)}.btn.p:hover{filter:brightness(1.07);border-color:transparent}.btn.p:not(.s){padding:0 24px 0 0;overflow:hidden;gap:14px}.btn.p:not(.s)::before{content:'\203A';align-self:stretch;display:grid;place-items:center;width:46px;background:linear-gradient(#fff,#dfe3e6);color:#1e5fd8;font-size:24px;font-weight:800;line-height:1;box-shadow:inset -1px 0 0 rgba(0,0,0,.08)}.btn.p.s{padding:0 16px}.btn.s{min-height:36px;padding:0 12px;font-size:13px}.btn.d{color:#b42318}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.f{display:block;margin:0 0 12px}.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--m)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font:16px inherit;font-family:inherit}input[type=checkbox]{width:20px;min-height:20px;height:20px}textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--p);outline-offset:1px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.logo{font-weight:800;font-size:1.15rem;display:inline-flex;gap:8px;align-items:center;background:#fff;color:#0a2a6b;padding:4px 12px 4px 8px;border-radius:12px;white-space:nowrap}.logo img{height:30px;width:auto;display:block}
.big{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:-.03em}.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--s);color:var(--p);font-size:12px;font-weight:700}
.bub{max-width:85%;padding:10px 14px;border-radius:16px;margin:6px 0;font-size:15px;background:var(--bg);border:1px solid var(--b)}.bub.r{margin-left:auto;background:var(--s);border-color:transparent}.bub.n{background:var(--w);margin:6px auto;font-size:13px}
.hero{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center;padding:36px 0}
.step{counter-increment:s}.step:before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--p);color:var(--pt);font-weight:800;margin-bottom:8px}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.flow b{padding:12px 16px;border-radius:12px;background:var(--s);color:var(--p)}
details{border-bottom:1px solid var(--b);padding:14px 0}summary{font-weight:600;cursor:pointer}
.app{display:block}.side{display:none}.main{padding:16px 16px 100px;max-width:1000px;margin:0 auto}
.bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}.bn a{flex:1;text-align:center;font-size:11px;text-decoration:none;padding:4px;color:var(--m);font-weight:600}.bn a b{display:block;font-size:20px}.bn a.on{color:var(--p)}
@media(min-width:900px){.side{display:flex;align-items:center;gap:20px;padding:10px 28px;border-bottom:1px solid var(--b);background:var(--c);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.side .nv{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}.side .nv a{white-space:nowrap;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;color:var(--m)}.side .nv a:hover,.side .nv a.on{background:var(--s);color:var(--p)}.bn{display:none}.main{padding:28px 32px;width:100%}}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--m);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--p);border-radius:6px 6px 0 0;min-height:3px;transition:.4s}
.prog{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px}.prog a{flex:1;min-width:64px;text-align:center;font-size:12px;font-weight:600;padding:8px 4px;border-radius:10px;background:var(--c);border:1px solid var(--b);text-decoration:none;color:var(--m)}.prog a.on{background:var(--p);color:var(--pt);border-color:var(--p)}.prog a.dn{color:var(--p)}
.li{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--b)}.li:last-child{border:0}
.cv{display:grid;gap:14px}@media(min-width:900px){.cv{grid-template-columns:300px 1fr}}
.ch{padding:10px 12px;border-radius:12px;cursor:pointer;display:block;text-decoration:none}.ch:hover,.ch.on{background:var(--s)}
.empty{text-align:center;padding:28px 12px;color:var(--m)}

const f=(l,p,o={})=>`<label class="f"><span>${t(l)}</span>${o.ta?`<textarea data-p="${p}" rows="3" placeholder="${e(o.ph||'')}">${e(g(p))}</textarea>`:`<input data-p="${p}" type="${o.ty||'text'}" value="${e(g(p))}" placeholder="${e(o.ph||'')}" ${o.l?`list="${o.l}"`:''}>`}</label>`;

const CATS=['Beauty salon','Spa','Dental clinic','Medical clinic','Restaurant','Hotel','Car rental','Real estate','Other'],REG=['Addis Ababa','Oromia','Amhara','Tigray','Sidama','Somali','Afar','Dire Dawa','Harari','Gambela','Benishangul-Gumuz','Central Ethiopia','South Ethiopia','South West Ethiopia'],SUB=['Bole','Kirkos','Yeka','Arada','Lideta','Nifas Silk-Lafto','Kolfe Keranio','Gulele','Addis Ketema','Akaky Kaliti','Lemi Kura'];
const ST=[['business','Business'],['location','Location'],['hours','Hours'],['services','Services'],['ai','Teach AI'],['connect','Connect'],['finish','Finish']];
// ---------- forms
const fBiz=()=>`<div class="row" style="margin-bottom:12px">${S.biz.logo?`<img src="${S.biz.logo}" width=56 height=56 style="border-radius:14px" alt="">`:''}<label class="f" style="flex:1"><span>Logo</span><input type="file" id="lg" accept="image/*"></label></div>${f('Business name','biz.name',{ph:'e.g. Selam Beauty Salon'})}${sel('Business category','biz.cat',CATS)}${f('Description','biz.desc',{ta:1,ph:'What do you do, in one or two sentences?'})}${f('Phone number','biz.phone',{ty:'tel'})}${f('Email','biz.email',{ty:'email'})}${f('Website','biz.web',{ph:'optional'})}${sel('Language your AI uses with customers','biz.clang',[['en','English'],['am','አማርኛ (Amharic)'],['auto','Match each customer']])}`;
const fLoc=()=>`<datalist id="sb">${SUB.map(x=>`<option>${x}</option>`)}</datalist>${sel('Region','loc.region',REG)}${f('City','loc.city',{ph:'Addis Ababa'})}${f('Sub-city','loc.sub',{l:'sb'})}${f('Woreda','loc.woreda',{ph:'e.g. 03'})}${f('Street / area','loc.street',{ph:'e.g. Around Bole Medhanialem'})}${f('Building name / number','loc.bldg')}${f('Landmark','loc.landmark',{ph:'e.g. Opposite the bank, behind the church'})}${f('Map location','loc.map',{ph:'Paste a Google Maps link or tap the button'})}<button class="btn s" data-a="geo">📍 Use my current location</button>`;
const fHours=()=>DAYS.map(d=>{const h=S.hours[d];return`<div class="card" style="margin-bottom:10px"><div class="row sp"><b>${d}</b><label class="row"><input type="checkbox" data-p="hours.${d}.open" data-r=1 ${h.open?'checked':''}>${h.open?'Open':'Closed'}</label></div>${h.open?h.slots.map((s,i)=>`<div class="row" style="margin-top:8px"><input type="time" data-p="hours.${d}.slots.${i}.0" value="${s[0]}" style="width:130px"> — <input type="time" data-p="hours.${d}.slots.${i}.1" value="${s[1]}" style="width:130px">${h.slots.length>1?`<button class="btn s d" data-a="delSlot" data-v="${d}.${i}">✕</button>`:''}</div>`).join('')+`<div class="row" style="margin-top:8px"><button class="btn s" data-a="addSlot" data-v="${d}">+ Add period</button><button class="btn s" data-a="h24" data-v="${d}">Open 24 hours</button>${d=='Mon'?`<button class="btn s" data-a="copyMon">Copy Monday to all days</button>`:''}</div>`:''}</div>`}).join('')+f('Holidays when you are closed','holidays',{ta:1,ph:'e.g. Enkutatash (Sep 11), Meskel (Sep 27), Genna, Timkat'});
const fSvc=()=>`<div class="card" style="margin-bottom:14px"><div class="g g3"><label class="f"><span>Service name</span><input id="sn" placeholder="Teeth Whitening"></label><label class="f"><span>Price (ETB)</span><input id="sp" type="number" inputmode="numeric" placeholder="3500"></label><label class="f"><span>Minutes</span><input id="sd" type="number" inputmode="numeric" placeholder="60"></label></div><details><summary>More details</summary><label class="f"><span>Description</span><input id="sx"></label><label class="f"><span>Category</span><input id="sc"></label></details><button class="btn p" data-a="addSvc">+ Add service</button></div>${S.services.length?S.services.map((s,i)=>`<div class="li"><div><b>${e(s.name)}</b> <span class="m">${etb(s.price)} · ${e(s.dur)} min</span><div class="m" style="font-size:13px">${e(s.cat||'')} ${e(s.desc||'')}</div></div><button class="btn s d" data-a="delSvc" data-v="${i}">Delete</button></div>`).join(''):'<p class="empty">No services yet. Add your first one above — customers will ask about prices.</p>'}`;
const fAI=()=>`<p class="m">Your AI uses this information when talking to your customers.</p>${f('About the business','ai.about',{ta:1})}${f('What makes you different?','ai.diff',{ta:1})}<h3>Questions customers ask</h3><div class="row" style="margin:8px 0"><input id="fq" placeholder="Question" style="flex:1 1 200px"><input id="fa" placeholder="Answer" style="flex:1 1 200px"><button class="btn s p" data-a="addFaq">Add</button></div>${S.ai.faqs.map((q,i)=>`<div class="li"><div><b>${e(q.q)}</b><div class="m">${e(q.a)}</div></div><button class="btn s d" data-a="delFaq" data-v="${i}">Delete</button></div>`).join('')}<h3 style="margin-top:16px">Policies</h3>${f('Cancellation policy','ai.cancel',{ta:1})}${f('Refund policy','ai.refund',{ta:1})}${f('Payment information','ai.pay',{ta:1,ph:'e.g. Telebirr, CBE Birr, cash'})}${f('Appointment rules','ai.rules',{ta:1,ph:'e.g. Please arrive 10 minutes early'})}${sel('AI personality','ai.tone',['Friendly','Professional','Warm','Concise'])}${f('Custom instructions','ai.custom',{ta:1,ph:'Always greet customers politely. Never promise a discount without approval.'})}`;
const fHand=()=>`<div class="card"><h3>When should the AI stop and ask a human?</h3>${[['refund','Customer asks for a refund'],['angry','Customer is angry'],['unknown',"AI doesn't know the answer"],['discount','Customer asks for a special discount']].map(([k,l])=>`<label class="row" style="padding:8px 0"><input type="checkbox" data-p="ai.h.${k}" ${S.ai.h[k]?'checked':''}>${l}</label>`).join('')}</div>`;
const fConn=()=>`<p class="m">Choose where your AI talks to customers. Provider setup (phone number / SMS gateway) is added when you go live.</p>${[['phone','📞 Phone (missed calls)'],['sms','💬 SMS']].map(([k,l])=>`<div class="li"><b>${l}</b><button class="btn s ${S.ch[k]?'p':''}" data-a="ch" data-v="${k}">${S.ch[k]?'Enabled ✓':'Connect'}</button></div>`).join('')}${['WhatsApp','Email','Telegram'].map(x=>`<div class="li"><b>${x}</b><span class="pill">Coming soon</span></div>`).join('')}`;
// ---------- onboarding
function onb(step){const i=Math.max(0,ST.findIndex(s=>s[0]==step)),k=ST[i][0];S.step=i;
const body={business:fBiz,location:fLoc,hours:fHours,services:fSvc,ai:fAI,connect:fConn,finish:()=>`<div style="text-align:center;padding:20px 0"><div style="font-size:56px">🚀</div><h2>${t('Your AI is ready. 🚀')}</h2><p class="m">Your business information is set up. Your AI can now help respond to customers and recover missed opportunities.</p><button class="btn p" data-a="finish">${t('Go to Dashboard')}</button></div>`}[k]();
const titles={business:'Tell us about your business',location:'Where can customers find you?',hours:'When are you open?',services:'What do you offer?',ai:'Teach your AI about your business',connect:'Connect your channels'};
return`<div class="w" style="max-width:680px"><div class="nav">${logo}<span class="row"><span class="m" id="sv" style="font-size:12px"></span>${lt()}</span></div><div class="prog">${ST.map((s,j)=>`<a href="#/onboarding/${s[0]}" class="${j==i?'on':j<i?'dn':''}">${j<i?'<span>✓</span> ':''}${s[1]}</a>`).join('')}</div><div class="card"><h2 style="margin-bottom:14px;font-size:1.5rem">${t(titles[k]||'')}</h2>${body}</div>${k!='finish'?`<div class="row sp" style="margin-top:14px">${i?`<a class="btn" href="#/onboarding/${ST[i-1][0]}">${t('Back')}</a>`:'<span></span>'}<a class="btn p" href="#/onboarding/${ST[i+1][0]}">${t('Next')}</a></div>`:''}</div>`}
// ---------- metrics
const RV=x=>x.reduce((s,l)=>s+(+l.value||0),0),won=(a,b)=>S.leads.filter(l=>l.status=='Won'&&l.wts>=a&&l.wts<b),ok=l=>l.status=='Won'||l.status=='Booked';
function M(d){const n=Date.now(),a=n-d*DAY,p=a-d*DAY,L=S.leads.filter(l=>l.ts>=a),rev=RV(won(a,n+1)),pv=RV(won(p,a));return{rev,pv,rec:L.filter(ok).length,ap:S.appts.filter(x=>x.ts>=a).length,mc:L.filter(l=>l.source=='Missed call'&&ok(l)).length,cv:L.length?Math.round(100*L.filter(ok).length/L.length):0,re:L.filter(l=>l.source=='Old customer'&&ok(l)).length,ai:S.convos.filter(c=>c.ts>=a&&c.msgs.some(m=>m.r=='ai')).length}}
function chart(d){const n=Date.now(),a=n-d*DAY,st=d*DAY/7,v=[...Array(7)].map((_,i)=>RV(won(a+i*st,a+(i+1)*st+1))),mx=Math.max(...v,1);return`<div class="bars">${v.map((x,i)=>{const dt=new Date(a+(i+.5)*st);return`<div>${x?etb(x).replace('ETB ',''):''}<i style="height:${Math.max(2,x/mx*100)}%"></i>${d<=1?dt.getHours()+'h':(dt.getMonth()+1)+'/'+dt.getDate()}</div>`}).join('')}</div>${v.some(x=>x)?'':'<p class="empty">Your first recovered customer will show here. Add a lead and mark it <b>Won</b>.</p>'}`}
const kp=(l,v)=>`<div class="card"><div class="m" style="font-size:13px">${t(l)}</div><div style="font-size:1.8rem;font-weight:800">${v}</div></div>`;
const fd=d=>{try{return new Date(d+'T00:00').toLocaleDateString(lang=='en'?'en-US':lang,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}catch(x){return d}};
const ago=ts=>{const m=Math.round((Date.now()-ts)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};

const trGet=l=>{if(!TR[l]){try{TR[l]=JSON.parse(localStorage.getItem('tr_'+l)||'{}')}catch(x){TR[l]={}}}return TR[l]};

for(const n of a){let m=ORIG.get(n);if(!m||n.data!==m.out){m={orig:n.data,out:n.data};ORIG.set(n,m)}const k=m.orig.trim(),r=lk(k,dc);if(r){const o=m.orig.replace(k,()=>r);if(n.data!==o){n.data=o;m.out=o}}else miss.add(k)}

async function fetchTr(arr){busy=true;const L=lang,name=LANGS.find(x=>x[0]==L)[2];note('Translating…');

try{const o=JSON.parse(r.text.trim().replace(/^```(?:json)?/,'').replace(/```$/,'').trim());if(Array.isArray(o)&&o.length==ch.length)ch.forEach((k,j)=>{if(typeof o[j]=='string'&&o[j])tr[k]=o[j]})}catch(x){}
try{localStorage.setItem('tr_'+L,JSON.stringify(tr))}catch(x){}if(L==lang)applyTr()}}
catch(x){arr.forEach(k=>TRIED.add(L+'|'+k));note('Translation needs claude.ai — showing English');setTimeout(()=>note(''),3500);busy=false;return}
busy=false;note('');if(L==lang)applyTr()}
